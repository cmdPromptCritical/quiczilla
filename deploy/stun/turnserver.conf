# Quiczilla public STUN-only configuration for coturn.
#
# Replace the listening IP with the VM's public interface, or omit it to bind
# all local interfaces. Do not enable TURN relay functionality for Quiczilla's
# default discovery service.

listening-port=3478
# listening-ip=203.0.113.10

stun-only
no-auth
fingerprint
no-tcp
no-tls
no-dtls
no-udp-relay
no-tcp-relay
no-cli
no-software-attribute

no-stdout-log
log-file=syslog
