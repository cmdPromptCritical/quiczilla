[workspace]
members = [
    "core",
    "worker",
    "cli",
]
resolver = "2"

[workspace.package]
version = "0.1.10"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/cmdPromptCritical/quiczilla"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
